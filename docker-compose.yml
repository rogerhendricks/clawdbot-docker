services:
  clawdbot-gateway:
    build: .
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
    volumes:
      - openclaw-config:/home/openclaw/.openclaw
      - clawdbot-workspace:/home/openclaw/workspace
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - CLAWDBOT_GATEWAY_BIND=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"

  clawdbot-cli:
    build: .
    profiles: ["cli"]
    stdin_open: true
    tty: true
    volumes:
      - openclaw-config:/home/openclaw/.openclaw
      - clawdbot-workspace:/home/openclaw/workspace
    env_file:
      - .env
    entrypoint: ["openclaw"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  openclaw-config:
  openclaw-workspace:
